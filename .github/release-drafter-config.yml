name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '💥 Breaking Changes'
    labels:
      - breaking-change
  - title: '💡 New Features'
    labels:
      - feature
      - enhancement
  - title: '🐛 Bug Fixes'
    labels:
      - bug
      - fix
      - bugfix
  - title: '⚙️ Technical Debt'
    labels:
      - refactor
  - title: '📝 Documentation'
    labels:
      - documentation

change-template: "- (#$NUMBER) $TITLE by @$AUTHOR"

no-changes-template: 'No significant changes'

template: |
  ## 🚀 Release $RESOLVED_VERSION

  ### What's Changed
  $CHANGES

  ---

  ### 📦 Published Artifacts

  **PyPI**
  - Package: [indian-bank-statement-parser $RESOLVED_VERSION](https://pypi.org/project/indian-bank-statement-parser/)

  **Docker (GHCR)**
  - Image: `docker pull ghcr.io/raptar231/indian-bank-statement-parser:v$RESOLVED_VERSION`
  - Registry: [ghcr.io/raptar231/indian-bank-statement-parser](https://github.com/raptar231/indian-bank-statement-parser/pkgs/container/indian-bank-statement-parser)

  **Install**
  ```bash
  pip install indian-bank-statement-parser==$RESOLVED_VERSION
  ```

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
  patch:
    labels:
      - patch
  default: patch